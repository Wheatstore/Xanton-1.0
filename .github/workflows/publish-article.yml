name: Publish a researched history article
on:
  schedule:
    - cron: '0 16 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: history-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: vars.ARTICLE_AUTOPUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Check deployment configuration
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: test -n "$VERCEL_DEPLOY_HOOK"
      - name: Research, write and verify one queued article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARTICLE_MODEL: ${{ vars.ARTICLE_MODEL }}
          ARTICLE_FIREBASE_PROJECT_ID: ${{ vars.ARTICLE_FIREBASE_PROJECT_ID }}
          ARTICLE_FIREBASE_API_KEY: ${{ secrets.ARTICLE_FIREBASE_API_KEY }}
        run: node scripts/publish-article.mjs
      - name: Validate content and publication failure cases
        run: node --test scripts/article-validation.test.mjs
      - name: Build and check crawlable articles
        run: npm run build && node scripts/check-article-build.mjs
      - name: Commit validated content
        id: commit
        run: |
          if git diff --quiet -- src/content/articles.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'Echoes publishing bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/articles.json
          git commit -m 'Publish researched history article'
          git push origin HEAD
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Trigger production rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo 'No deploy hook configured. Confirm the Git integration deployed the new commit.'
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK" > /dev/null
